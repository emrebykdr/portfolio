services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: emrebykdr-portfolio:local
    container_name: portfolio
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
